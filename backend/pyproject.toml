[tool.poetry]
name = "nfinit-backend"
version = "0.1.0"
description = "Nfinit geometry engine - FastAPI + build123d"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fastapi = ">=0.109.0"
uvicorn = ">=0.27.0"
build123d = ">=0.10.0"
python-multipart = ">=0.0.6"
langgraph = ">=1.2.11"
openai = ">=3.14.0"
python-dotenv = ">=1.2.3"
langfuse = ">=4.15.3"
pinecone = "^10.0.0"
psycopg = {extras = ["binary"], version = "^3.3.6"}
pyjwt = {extras = ["crypto"], version = "^2.15.0"}

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1"
pytest-asyncio = ">=1.4.0"
httpx = ">=0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
