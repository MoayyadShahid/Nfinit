[tool.poetry]
name = "nfinit-backend"
version = "0.1.0"
description = "Nfinit geometry engine - FastAPI + build123d"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fastapi = ">=0.129.0"
uvicorn = ">=0.27.0"
build123d = ">=0.10.0"
python-multipart = ">=0.0.31"
langgraph = ">=1.2.11"
openai = ">=3.14.0"
python-dotenv = ">=1.2.3"
psycopg = {extras = ["binary"], version = "^3.3.6"}
pyjwt = {extras = ["crypto"], version = "^2.15.0"}
urllib3 = ">=2.8.0"
anyio = ">=4.14.2"
starlette = ">=1.3.1"
certifi = ">=2026.10.19"
psycopg-pool = "^3.2"
pillow = "12.1.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1"
pytest-asyncio = ">=1.4.0"
httpx = ">=0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
