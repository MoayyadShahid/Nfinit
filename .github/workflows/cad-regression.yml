name: CAD regression

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/cad-regression.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/cad-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cad-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.3"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"
      - uses: actions/cache@v4
        with:
          path: backend/.venv
          key: backend-venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/poetry.lock') }}
      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --with dev --no-root --no-interaction
      - name: Run backend tests
        working-directory: backend
        run: poetry run pytest -q

  cad50:
    name: CAD50 deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"
      - uses: actions/cache@v4
        with:
          path: backend/.venv
          key: backend-venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/poetry.lock') }}
      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --with dev --no-root --no-interaction
      - name: Execute canonical CAD50 benchmark
        working-directory: backend
        run: |
          poetry run python -m evaluation.cli \
            --cases evaluation/cases/cad50.json \
            --mode replay \
            --replays evaluation/replays/cad50.json \
            --output evaluation/reports/cad50.json
      - name: Enforce regression policy
        working-directory: backend
        run: |
          poetry run python -m evaluation.gate \
            --report evaluation/reports/cad50.json \
            --cases evaluation/cases/cad50.json \
            --policy evaluation/baselines/cad50.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad50-report-${{ github.run_id }}
          path: backend/evaluation/reports/cad50.json
          if-no-files-found: warn
          retention-days: 30
