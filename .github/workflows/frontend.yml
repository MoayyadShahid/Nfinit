name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and Studio controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck and lint
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npx eslint .
      - name: Production build
        run: npm run build -w frontend -- --webpack
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Verify Studio with local API fixtures
        env:
          NFNIT_ALLOW_LOCAL_AUTH_BYPASS: "true"
          BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
        run: |
          npm run dev -w frontend -- --hostname 127.0.0.1 --port 3100 > /tmp/nfinit-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          python -u frontend/tests/studio_controls.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-controls-${{ github.run_id }}
          path: |
            /tmp/nfinit-ui-checks
            /tmp/nfinit-next.log
          retention-days: 7
