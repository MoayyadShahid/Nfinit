name: Live CAD model evaluation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - cad50
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: live-cad-evaluation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.3"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  evaluate:
    name: ${{ matrix.label }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.ENABLE_SCHEDULED_PAID_EVALS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: claude-sonnet-5-5
            label: Claude Sonnet 5.5
            model: anthropic/claude-sonnet-5.5
          - key: claude-opus-5-5
            label: Claude Opus 5.5
            model: anthropic/claude-opus-5.5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"
      - uses: actions/cache@v4
        with:
          path: backend/.venv
          key: backend-venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/poetry.lock') }}
      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --with dev --no-root --no-interaction
      - name: Validate paid-run credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$OPENROUTER_API_KEY" || {
            echo "::error::OPENROUTER_API_KEY is not configured"
            exit 1
          }
      - name: Run live evaluation
        working-directory: backend
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUITE: ${{ inputs.suite || 'smoke' }}
          MODEL_ID: ${{ matrix.model }}
          MODEL_KEY: ${{ matrix.key }}
        run: |
          args=(
            --cases "evaluation/cases/${SUITE}.json"
            --mode live
            --config evaluation/config/live_quality.json
            --model "$MODEL_ID"
            --output "evaluation/reports/live-${SUITE}-${MODEL_KEY}.json"
          )
          poetry run python -m evaluation.cli "${args[@]}"
      - name: Upload live evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ inputs.suite || 'smoke' }}-${{ matrix.key }}-${{ github.run_id }}
          path: backend/evaluation/reports/live-*.json
          if-no-files-found: warn
          retention-days: 90
