name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you try to do, and what stops you now.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How Nfinit could help. Include an example part if you can.
